name: Actualizar perfil

on:
  schedule:
    - cron: "0 6 * * *"      # todos los días
  workflow_dispatch:          # botón manual en la pestaña Actions
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar estadísticas (SVG propio)
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Generar serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Guardar cambios en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/snake.svg assets/snake-dark.svg
          git diff --staged --quiet || git commit -m "chore: actualizar estadísticas y serpiente"
          git push
